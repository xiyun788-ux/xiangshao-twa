name: Build APK

# 作用：把 android/ 下的「WebView 全屏原生壳」工程打包成**我们自己的签名密钥**签名的安卓 APK。
# 触发器：手动（workflow_dispatch）或推送 main 分支时自动构建。
# 产物：app-release-signed.apk（GitHub Release 免登录下载）。
#
# 稳定下载链接：
#   https://github.com/xiyun788-ux/xiangshao-twa/releases/latest/download/app-release-signed.apk
#
# 需要的仓库 Secrets：
#   STORE_PASSWORD —— keystore 密码（与 key 密码相同）。
#   KEY_PASSWORD  —— key 密码（与 store 密码相同）。
#   SIGNING_KEYSTORE —— 首次由早期流程生成并保存的 base64 keystore，之后每次构建解码复用。
#
# ── 架构说明（v1.1.0 起）──
#   本 APK 为「本地离线自包含」版本：整站（含 512 个离线发音 mp3）已打包进
#   android/app/src/main/assets/www/，由原生壳用零依赖的本地 HTTP 服务器
#   （java.net.ServerSocket，仅监听 127.0.0.1:8080）提供给 WebView 加载。
#   → 彻底离线、不连任何远端，无网也能用；也规避了此前「WebView 连远端站点偶发白屏」的问题。
#   → 因此「改内容（课程/音频/文案）现在必须重打 APK」：先在本机把最新的 H5 构建产物
#     （dist/build/h5/ 整站）拷进 assets/www/，再推送 android/ 触发本工作流。
#   → 改壳（图标/名字/起始页/主题）同样需要改 android/ 工程后重新运行本工作流。
#
# ─────────────────────────────────────────────────────────────
# 为什么是 WebView 壳而不是 TWA：
#   TWA 要真正全屏无地址栏，必须在站点根放 assetlinks.json（Digital Asset Links 验证）。
#   我们的站点托管在 suikey.app.workbuddy.host（WorkBuddy 统一托管），没有权限往根目录塞这个文件，
#   于是 Chrome 不信任该 TWA，回退成「用浏览器打开网页」——顶部地址栏/底部工具栏都在，体验就是网页。
#   WebView 壳绕开这个限制：用 Android 原生 WebView 全屏加载站点，无地址栏、独立图标、
#   返回键在 App 内导航不跳浏览器，且不依赖任何域名验证。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEY_ALIAS: xiangshao
      BUILD_TOOLS: 36.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 手动安装 Android SDK（比 android-actions/setup-android 更稳）。
      # core 的 AndroidSdkTools.validatePath 要求 SDK 根下存在 tools/ 或 bin/ 目录 → 补 tools/。
      - name: Set up Android SDK (manual)
        run: |
          set -euo pipefail
          ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null || true   # yes 会被 SIGPIPE，必须吞掉非 0 退出码
          sdkmanager "build-tools;36.1.0" "platforms;android-36" "platform-tools"

      - name: Decode keystore for build
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > android.keystore
          test -s android.keystore || { echo "SIGNING_KEYSTORE 为空"; exit 1; }
          keytool -list -keystore android.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /tmp/ks.txt 2>&1 \
            || { echo "密钥不可读："; cat /tmp/ks.txt; exit 1; }
          head -3 /tmp/ks.txt

      - name: Generate launcher icons
        run: python scripts/make-icons.py

      - name: Build APK (gradle assembleRelease)
        run: |
          set -euo pipefail
          cd android
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align + sign APK
        env:
          KS_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED" || { echo "未找到 $UNSIGNED"; ls -R android/app/build/outputs || true; exit 1; }
          "$BT/zipalign" -p -f 4 "$UNSIGNED" app-release-aligned.apk

          # 私钥可能用 store 密码或 key 密码加密（取决于密钥当初怎么生成），两个候选依次试。
          sign_with() {  # $1 = 私钥密码
            "$BT/apksigner" sign \
              --ks android.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$1" \
              --out app-release-signed.apk app-release-aligned.apk
          }

          SIGNED=""
          for CAND in "$KEY_PASS" "$KS_PASS"; do
            rm -f app-release-signed.apk
            if sign_with "$CAND" 2>/tmp/apksigner.err; then
              SIGNED=app-release-signed.apk
              echo "签名成功"
              break
            fi
            echo "该候选私钥密码不可用：$(tail -2 /tmp/apksigner.err | tr '\n' ' ')"
          done

          if [ -z "$SIGNED" ]; then
            echo "!! 密钥不匹配 → 重新生成本次密钥（注意：老用户将不能覆盖升级）"
            keytool -genkeypair -v -keystore android.keystore -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -alias "$KEY_ALIAS" -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=XiYun, OU=XiYun, O=XiYun, L=Changsha, ST=Hunan, C=CN"
            rm -f app-release-signed.apk
            sign_with "$KS_PASS"
          fi

          echo "--- 验签 ---"
          "$BT/apksigner" verify --verbose --print-certs app-release-signed.apk
          echo "--- 包信息 ---"
          "$BT/aapt2" dump badging app-release-signed.apk | head -12 || true
          ls -la app-release-signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiangshao-release-apk
          path: app-release-signed.apk

      # 发布到 GitHub Release，生成「任何人免登录可下载」的稳定链接：
      # https://github.com/xiyun788-ux/xiangshao-twa/releases/latest/download/app-release-signed.apk
      # 用 REST API 而非 `gh release`：可幂等「有则更新同名资产、无则新建 release」。
      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          RID=$(curl -sSL "${AUTH[@]}" "$API/releases/tags/apk-build" | jq -r '.id // empty' || true)
          if [ -z "$RID" ]; then
            echo "创建 release apk-build …"
            RID=$(curl -fsSL -X POST "${AUTH[@]}" -H "Content-Type: application/json" \
              -d '{"tag_name":"apk-build","name":"英语小花园 APK（自动构建）","body":"湘少版三年级英语辅助学习 App 的安卓安装包，使用本仓库自管签名密钥。安装前请允许「未知来源」安装。","draft":false,"prerelease":false}' \
              "$API/releases" | jq -r '.id')
          else
            echo "release apk-build 已存在（id=$RID），更新资产。"
          fi

          AID=$(curl -fsSL "${AUTH[@]}" "$API/releases/$RID/assets" \
            | jq -r 'map(select(.name=="app-release-signed.apk"))[0].id // empty')
          if [ -n "$AID" ]; then
            # 删除资产要用 /releases/assets/{asset_id}，不是 /releases/{id}/assets/{asset_id}
            echo "删除同名旧资产 asset_id=$AID"
            curl -fsSL -X DELETE "${AUTH[@]}" "$API/releases/assets/$AID"
          fi

          curl -fsSL -X POST "${AUTH[@]}" \
            -H "Content-Type: application/vnd.android.apk" \
            --data-binary @app-release-signed.apk \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RID/assets?name=app-release-signed.apk" \
            | jq -r '"已上传: " + .name + " (" + (.size|tostring) + " bytes) -> " + .browser_download_url'
