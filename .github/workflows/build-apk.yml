name: Build TWA APK

# 作用：用 Google 官方 Bubblewrap 把线上 PWA 打包成**我们自己的签名密钥**签名的安卓 APK。
# 触发器：手动（workflow_dispatch）或推送 main 分支时自动构建。
# 产物：app-release-signed.apk（GitHub Actions Artifact，可由仓库管理员下载后挂到 Web 站点）。
#
# 需要的仓库 Secrets（首次运行前由管理员配置）：
#   GH_PAT        —— 有 repo 权限的 GitHub Personal Access Token，仅用于「首次自动生成并保存签名密钥」，
#                    密钥生成后此 Secret 可删除（后续构建直接复用已保存的 SIGNING_KEYSTORE）。
#   STORE_PASSWORD—— keystore 密码（自定义一串强随机值）。
#   KEY_PASSWORD  —— key 密码（可等同 store 密码）。
#   SIGNING_KEYSTORE —— 首次运行由本工作流用 keytool 生成并自动写入；之后每次构建解码复用。
#
# 改内容（课程/音频/文案）不需要重打 APK（TWA 加载线上站点自动生效）；
# 改壳（图标/名字/主题/起始页）才需要重新运行本工作流（同密钥覆盖安装，进度不丢）。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEY_ALIAS: xiangshao
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 手动安装 Android SDK（比 android-actions/setup-android 更稳，避免该 Action 偶发失败）。
      - name: Set up Android SDK (manual)
        run: |
          ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Install Bubblewrap CLI + secret sealing dep
        run: |
          npm install -g @bubblewrap/cli
          npm install tweetsodium@0.0.4

      # 首次运行：用 keytool 生成签名密钥，并通过 REST API（libsodium 密封）写入仓库 Secret。
      # 之后 SIGNING_KEYSTORE 已存在，跳过生成，直接使用。
      # 注意：刻意不用 `gh secret set`——`gh auth login --with-token` 会强制要求 token 带 read:org
      #       权限，我们的 PAT 只有 repo(+workflow)，gh 会直接报错失败。
      - name: Bootstrap signing keystore (one-time)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SECRET_NAME: SIGNING_KEYSTORE
        run: |
          set -euo pipefail
          EXISTING=$(curl -fsSL -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/secrets")
          if echo "$EXISTING" | grep -q SIGNING_KEYSTORE; then
            echo "SIGNING_KEYSTORE already exists — reuse."
          else
            echo "Generating signing keystore and storing as repo secret…"
            keytool -genkeypair -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 36500 \
              -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=XiYun, OU=XiYun, O=XiYun, L=Changsha, ST=Hunan, C=CN"
            base64 -w0 keystore.jks > keystore.b64
            node scripts/seal-secret.mjs
          fi

      - name: Decode keystore for build
        run: echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > keystore.jks

      # bubblewrap init 是**交互式**的（inquirer）：必须给它真正的 TTY。
      # 用管道喂输入时，第一个问题会把整块输入当成一个字符流吃掉、回车也不提交，
      # 表现为 init 步骤一直 in_progress 直到 6 小时超时。
      # 这里用 scripts/run-init.py 分配伪终端，按提示语顺序逐条回答。
      #   ① 预置 ~/.bubblewrap/config.json → 跳过「是否安装 JDK / Android SDK」提问
      #   ② 预置 android-keystore 文件      → 跳过「是否创建签名密钥」提问
      - name: Init TWA project (scripted via pty)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cp keystore.jks android-keystore
          python3 scripts/run-init.py bubblewrap init \
            --manifest "https://suike.app.workbuddy.host/manifest.webmanifest?sharecode=24NRJSLYLH" \
            --packageId com.xiangshao.grade3 \
            --appName "英语小花园" \
            --host suike.app.workbuddy.host \
            --themeColor "#4CAF6E" \
            --navigationColor "#4CAF6E" \
            --backgroundColor "#FDF8EE" \
            --shortName "英语小花园" \
            --targetSdkVersion 34 \
            --minSdkVersion 21 \
            --areJavaDependenciesAccepted true

      - name: Build signed APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bubblewrap build \
            --signingKeyPath ./keystore.jks \
            --signingKeyAlias "$KEY_ALIAS" \
            --signingKeyPassword "$KEY_PASSWORD" \
            --signingStorePassword "$STORE_PASSWORD"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiangshao-release-apk
          path: app-release-signed.apk

      # 发布到 GitHub Release，生成「任何人免登录可下载」的稳定链接：
      # https://github.com/xiyun788-ux/xiangshao-twa/releases/latest/download/app-release-signed.apk
      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-build -y || true
          gh release create apk-build app-release-signed.apk \
            --title "英语小花园 APK（自动构建）" \
            --notes "湘少版三年级英语辅助学习 App 的安卓安装包，使用本仓库自管签名密钥。安装前请允许「未知来源」安装。"
