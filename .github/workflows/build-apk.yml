name: Build APK

# 作用：把 android/ 下的「WebView 全屏原生壳」工程打包成**我们自己的签名密钥**签名的安卓 APK。
# 触发器：手动（workflow_dispatch）或推送 main 分支时自动构建。
# 产物：app-release-signed.apk（GitHub Release 免登录下载）。
#
# 稳定下载链接：
#   https://github.com/xiyun788-ux/xiangshao-twa/releases/latest/download/app-release-signed.apk
#
# 需要的仓库 Secrets：
#   STORE_PASSWORD —— keystore 密码（与 key 密码相同）。
#   KEY_PASSWORD  —— key 密码（与 store 密码相同）。
#   SIGNING_KEYSTORE —— 首次由早期流程生成并保存的 base64 keystore，之后每次构建解码复用。
#
# ── 架构说明（v1.2.0 起；v1.1.0 的本地 HTTP 服务器已彻底删除）──
#   本 APK 为「file:// 单文件离线自包含」版本：整站（含 512 个离线发音 mp3）已打包进
#   android/app/src/main/assets/www/，MainActivity 直接
#   webView.loadUrl("file:///android_asset/www/index.html")。
#   · index.html 由 vite-plugin-singlefile 把 JS/CSS 全内联。真机 WebView 默认不开放
#     file→file 跨源 module/CORS，外链 <script type=module> 会被拦 → 白屏。
#     注意：带 --allow-file-access-from-files 的桌面 Chrome 拆成外链 module 仍能挂载，
#     所以「桌面能开」不等于「真机能开」，桌面验证不能替代真机。
#   · static/ 下的音频/字体/图标/插画由 config/path.ts 拼成「文档根绝对地址」加载。
#   · 无服务器、无端口、无明文。页面与全部静态资源随包离线，运行期零 http(s) 请求：
#     uni-app 框架内置的两条 CDN 阴影图（导航栏 ::after、body:after 的 3 秒延迟预加载）
#     已在 src/styles/tokens.css 全局置空；账号云同步是**可选在线功能**，
#     APK 内 src/services/cloud.ts 显式降级为 null，不发起请求、不报错。
#
# ── 前端源码不在本仓库（重要，历次「改了没生效」的复发源）──
#   本仓库根 = apk-build/，只含 .github / android / icons / scripts。
#   前端工程 xiangshao/ 在另一个目录，CI **不会**重新构建前端，只会把本仓库里
#   android/app/src/main/assets/www/ 的现有产物打进 APK。
#   因此「只改前端源码就 push」= CI 打包旧页面。提交前必须在本机按顺序完成，
#   这几步 CI 无法代替（verify_apk_payload.mjs 依赖本机 Chrome，ubuntu runner 没有）：
#     1. cd xiangshao && npm run build:h5      ← 必须 h5 平台，singlefile 才生效
#     2. 删除 dist/build/h5/ 里遗留的 _verify_*.png 截图（绝不能拷进 APK）
#     3. 把 dist/build/h5/ 整站同步覆盖到 android/app/src/main/assets/www/
#     4. node xiangshao/verify_apk_payload.mjs   ← 全套 file:// 真实渲染断言：
#        单文件化 / 全 10 路由非白屏 / 静态资源 / fetch 清单 512 条 / 无 SW / mp3 /
#        **Java 注入 JS 逐字重放**（P0 防复发）/ 图标守门 / **5 秒延迟外链观察** /
#        0 console error / 0 失败请求
#     5. node xiangshao/verify_native_inject.mjs ← 原生注入专项（多路由 + DOM 写操作禁令）
#     6. node xiangshao/verify_file_render.mjs && node xiangshao/verify_audio.mjs
#     7. build.gradle 的 versionCode 必须递增，否则已装用户无法覆盖升级
#   上方 "Guard APK payload" step 会静态守住仓库内产物的结构性不变量
#   （注入 JS 纯只读 / 单文件化 / 图标 26 / 音频 512 / 无截图污染 / versionCode 递增），
#   但它无法判断「源码是否重建过」—— 那是上面第 4、5 步的职责。
#
# ─────────────────────────────────────────────────────────────
# 为什么是 WebView 壳而不是 TWA：
#   TWA 要真正全屏无地址栏，必须在站点根放 assetlinks.json（Digital Asset Links 验证）。
#   我们的站点托管在 suikey.app.workbuddy.host（WorkBuddy 统一托管），没有权限往根目录塞这个文件，
#   于是 Chrome 不信任该 TWA，回退成「用浏览器打开网页」——顶部地址栏/底部工具栏都在，体验就是网页。
#   WebView 壳绕开这个限制：用 Android 原生 WebView 全屏加载站点，无地址栏、独立图标、
#   返回键在 App 内导航不跳浏览器，且不依赖任何域名验证。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEY_ALIAS: xiangshao
      BUILD_TOOLS: 36.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # guard_payload.py 需要 HEAD^ 比对 versionCode

      # 静态守门：gradle 打包前拦截结构性复发（P0 注入改写 DOM / P1 图标缺失 /
      # 单文件化被破坏 / 载荷污染 / versionCode 未递增）。纯 Python，无需 Chrome。
      - name: Guard APK payload (static invariants)
        run: python3 scripts/guard_payload.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 手动安装 Android SDK（比 android-actions/setup-android 更稳）。
      # core 的 AndroidSdkTools.validatePath 要求 SDK 根下存在 tools/ 或 bin/ 目录 → 补 tools/。
      - name: Set up Android SDK (manual)
        run: |
          set -euo pipefail
          ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null || true   # yes 会被 SIGPIPE，必须吞掉非 0 退出码
          sdkmanager "build-tools;36.1.0" "platforms;android-36" "platform-tools"

      - name: Decode keystore for build
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > android.keystore
          test -s android.keystore || { echo "SIGNING_KEYSTORE 为空"; exit 1; }
          keytool -list -keystore android.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /tmp/ks.txt 2>&1 \
            || { echo "密钥不可读："; cat /tmp/ks.txt; exit 1; }
          head -3 /tmp/ks.txt

      - name: Generate launcher icons
        run: python scripts/make-icons.py

      - name: Build APK (gradle assembleRelease)
        run: |
          set -euo pipefail
          cd android
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align + sign APK
        env:
          KS_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED" || { echo "未找到 $UNSIGNED"; ls -R android/app/build/outputs || true; exit 1; }
          "$BT/zipalign" -p -f 4 "$UNSIGNED" app-release-aligned.apk

          # 私钥可能用 store 密码或 key 密码加密（取决于密钥当初怎么生成），两个候选依次试。
          sign_with() {  # $1 = 私钥密码
            "$BT/apksigner" sign \
              --ks android.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$1" \
              --out app-release-signed.apk app-release-aligned.apk
          }

          SIGNED=""
          for CAND in "$KEY_PASS" "$KS_PASS"; do
            rm -f app-release-signed.apk
            if sign_with "$CAND" 2>/tmp/apksigner.err; then
              SIGNED=app-release-signed.apk
              echo "签名成功"
              break
            fi
            echo "该候选私钥密码不可用：$(tail -2 /tmp/apksigner.err | tr '\n' ' ')"
          done

          if [ -z "$SIGNED" ]; then
            echo "!! 密钥不匹配 → 重新生成本次密钥（注意：老用户将不能覆盖升级）"
            keytool -genkeypair -v -keystore android.keystore -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -alias "$KEY_ALIAS" -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=XiYun, OU=XiYun, O=XiYun, L=Changsha, ST=Hunan, C=CN"
            rm -f app-release-signed.apk
            sign_with "$KS_PASS"
          fi

          echo "--- 验签 ---"
          "$BT/apksigner" verify --verbose --print-certs app-release-signed.apk
          echo "--- 包信息 ---"
          "$BT/aapt2" dump badging app-release-signed.apk | head -12 || true
          ls -la app-release-signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiangshao-release-apk
          path: app-release-signed.apk

      # 发布到 GitHub Release，生成「任何人免登录可下载」的稳定链接：
      # https://github.com/xiyun788-ux/xiangshao-twa/releases/latest/download/app-release-signed.apk
      # 用 REST API 而非 `gh release`：可幂等「有则更新同名资产、无则新建 release」。
      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          RID=$(curl -sSL "${AUTH[@]}" "$API/releases/tags/apk-build" | jq -r '.id // empty' || true)
          if [ -z "$RID" ]; then
            echo "创建 release apk-build …"
            RID=$(curl -fsSL -X POST "${AUTH[@]}" -H "Content-Type: application/json" \
              -d '{"tag_name":"apk-build","name":"英语小花园 APK（自动构建）","body":"湘少版三年级英语辅助学习 App 的安卓安装包，使用本仓库自管签名密钥。安装前请允许「未知来源」安装。","draft":false,"prerelease":false}' \
              "$API/releases" | jq -r '.id')
          else
            echo "release apk-build 已存在（id=$RID），更新资产。"
          fi

          AID=$(curl -fsSL "${AUTH[@]}" "$API/releases/$RID/assets" \
            | jq -r 'map(select(.name=="app-release-signed.apk"))[0].id // empty')
          if [ -n "$AID" ]; then
            # 删除资产要用 /releases/assets/{asset_id}，不是 /releases/{id}/assets/{asset_id}
            echo "删除同名旧资产 asset_id=$AID"
            curl -fsSL -X DELETE "${AUTH[@]}" "$API/releases/assets/$AID"
          fi

          curl -fsSL -X POST "${AUTH[@]}" \
            -H "Content-Type: application/vnd.android.apk" \
            --data-binary @app-release-signed.apk \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RID/assets?name=app-release-signed.apk" \
            | jq -r '"已上传: " + .name + " (" + (.size|tostring) + " bytes) -> " + .browser_download_url'
